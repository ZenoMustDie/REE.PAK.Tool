name: CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1. Kodu sunucuya indirir (Hata almamanız için en kritik adım)
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. MSBuild ve NuGet araçlarını sunucuya kurar
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2
      with:
        nuget-version: 'latest'

    # 3. Dosyanın yerini log ekranında gösterir (Kontrol adımı)
    - name: Klasor Yapisini Listele
      run: Get-ChildItem -Recurse -Filter *.sln
      shell: pwsh

    # 4. Paketleri yüklemeyi dener
    - name: Restore NuGet Packages
      run: nuget restore REE.PAK.Tool.sln
