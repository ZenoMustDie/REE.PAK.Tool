name: CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1. Kodu sunucuya indirir
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. MSBuild ve NuGet araçlarını kurar
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2
      with:
        nuget-version: 'latest'

    # 3. Bağımlılıkları tek tek yükler
    - name: Restore NuGet Packages
      run: |
        nuget restore REE.Fonts.Cryptor/REE.Fonts.Cryptor.sln
        nuget restore REE.Packer/REE.Packer.sln
        nuget restore REE.Rom.Cryptor/REE.Rom.Cryptor.sln
        nuget restore REE.Unpacker/REE.Unpacker.sln

    # 4. Çözümleri tek tek derler ve çıktıları "Dagitim" klasörüne toplar
    - name: Build Solutions
      run: |
        msbuild REE.Fonts.Cryptor/REE.Fonts.Cryptor.sln /p:Configuration=Release /p:OutDir=../Dagitim/
        msbuild REE.Packer/REE.Packer.sln /p:Configuration=Release /p:OutDir=../Dagitim/
        msbuild REE.Rom.Cryptor/REE.Rom.Cryptor.sln /p:Configuration=Release /p:OutDir=../Dagitim/
        msbuild REE.Unpacker/REE.Unpacker.sln /p:Configuration=Release /p:OutDir=../Dagitim/

    # 5. Sunucuya Inno Setup kurulum aracını yükler
    - name: Inno Setup Kur
      run: choco install innosetup -y

    # 6. Kurulum betiğini "Dagitim" klasörüne bakacak şekilde oluşturur ve paketler
    - name: Kurulum Sihirbazini (Setup.exe) Olustur
      run: |
        cat << 'EOF' > iscript.iss
        [Setup]
        AppName=REE PAK Tool
        AppVersion=1.0
        DefaultDirName={autopf}\REE PAK Tool
        DefaultGroupName=REE PAK Tool
        OutputDir=.
        OutputBaseFilename=REE_PAK_Tool_Kurulum
        
        [Files]
        Source: "Dagitim\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs
        
        [Icons]
        Name: "{autoprograms}\REE PAK Tool\REE Unpacker"; Filename: "{app}\REE.Unpacker.exe"
        Name: "{autodesktop}\REE Unpacker"; Filename: "{app}\REE.Unpacker.exe"
        EOF
        
        iscc iscript.iss
      shell: bash

    # 7. Oluşan Setup.exe dosyasını indirme paneline ekler
    - name: Kurulum Dosyasini Sunucuya Yukle
      uses: actions/upload-artifact@v4
      with:
        name: REE-PAK-Tool-Kurulum-Sihirbazi
        path: REE_PAK_Tool_Kurulum.exe
